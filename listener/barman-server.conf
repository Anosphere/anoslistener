[validator1]
description = "validator 1: the PostgreSQL of its worker, the anos and keyholder databases"
conninfo = host=127.0.0.1 port=5433 user=listener dbname=postgres sslmode=disable gssencmode=disable connect_timeout=10
streaming_conninfo = host=127.0.0.1 port=5433 user=listener dbname=postgres sslmode=disable gssencmode=disable connect_timeout=10
backup_method = postgres
archiver = off
streaming_archiver = on
slot_name = listener1
create_slot = auto
path_prefix = /usr/lib/postgresql/17/bin
immediate_checkpoint = true
minimum_redundancy = 1
worm_mode = on
